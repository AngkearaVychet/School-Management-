<style>
/* Layout & Themes for Hampton International School */
:root {

  --ink: #101c33; --muted: #56647a; --navy: #0d2b6b; --navy-ink: #ffffff; --navy-soft: #e3ebf8;

  --bad: #b3352b; --bad-bg: #fbe4e1;
  --f-body: "Kantumruy Pro", "Noto Sans Khmer", "Plus Jakarta Sans", system-ui, sans-serif;
  --f-display: "Moul", "Khmer OS Muol Light", serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1520; --surface: #161e2c; --sunk: #1d2638; --line: #2b374d; --line-strong: #3d4d68;
    --ink: #e8ecf3; --muted: #9ba7bc; --navy: #15387d; --navy-ink: #ffffff; --navy-soft: #1d2c47;
    --marigold: #e8b04a; --marigold-soft: #382c16;
    --gA: #6fd3a0; --gA-bg: #173628; --gB: #6ccbd6; --gB-bg: #163339; --gC: #8fb3ef; --gC-bg: #1c2b45;
    --gD: #eabd63; --gD-bg: #3a2e14; --gE: #f08a80; --gE-bg: #3d1f1c; --gF: #9aa5b8; --gF-bg: #232b37;
    --bad: #f08a80; --bad-bg: #3d1f1c; color-scheme: dark;
  }
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }

/* Custom Scrollbar */
::-webkit-scrollbar { width: 7px; height: 7px; }

::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }

/* Shell Layout */
.app { display: flex; min-height: 100vh; min-height: 100dvh; }
.side {

  overflow-y: auto; display: flex; flex-direction: column; padding: 18px 12px calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 30;

  border-bottom: 1px solid rgba(255,255,255,0.14); margin-bottom: 10px; cursor: pointer;
}
.sb-logo {

.shell { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.pickers { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.scrim { display: none; }

@media (max-width: 900px) {
  .side { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-105%); box-shadow: 0 0 30px rgba(0,0,0,0.35); }
  body.nav-open .side { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(10,20,40,0.5); z-index: 25; }
  .menu-btn { display: inline-flex; }
}

main { max-width: 1400px; margin: 0 auto; width: 100%; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
.panel h2 { margin: 0 0 4px; font-size: 1.05rem; font-weight: 700; color: var(--navy); }
.panel .sub { margin: 0 0 14px; color: var(--muted); font-size: 0.85rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.88rem; white-space: nowrap; transition: all 0.15s; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.primary:hover { filter: brightness(1.15); }
.btn.danger { color: var(--bad); }
.btn.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.sm { padding: 3px 9px; font-size: 0.8rem; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
.inp { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 0.88rem; min-width: 0; }
.status { font-size: 0.82rem; color: var(--muted); font-weight: 500; }
.status.err { color: var(--bad); }
.hint { font-size: 0.8rem; color: var(--muted); }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty h2 { color: var(--ink); }

/* Quick Switch Role Bar */
.quick-roles { display: flex; align-items: center; gap: 4px; font-size: 0.78rem; }
.quick-roles button { border: 0; padding: 3px 8px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.75rem; color: #fff; transition: opacity 0.15s; }
.quick-roles button:hover { opacity: 0.85; }

/* Dashboard Hero */
.hero { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; background: linear-gradient(135deg, #fff 0%, #f0f5ff 100%); border: 1px solid var(--line); border-radius: var(--r); padding: 22px clamp(16px,3vw,30px); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -50px; top: -50px; width: 200px; height: 200px; border-radius: 50%; border: 24px solid var(--navy-soft); pointer-events: none; }
.hero .hlogo { width: 92px; height: 92px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; overflow: hidden; box-shadow: 0 0 0 4px var(--navy-soft), 0 0 0 6px var(--red); flex: none; position: relative; z-index: 1; }
.hero .hlogo img { width: 100%; height: 100%; object-fit: contain; }
.hero .htxt { position: relative; z-index: 1; min-width: 0; }
.hero h2 { font-family: var(--f-display); font-weight: 400; font-size: 1.4rem; line-height: 1.8; margin: 0; color: var(--navy); }
.hero .en { color: var(--red); font-weight: 700; letter-spacing: 0.05em; font-size: 0.9rem; text-transform: uppercase; }
.hero .meta { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

/* Stats Tiles */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.02); }
.stat .k { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
.stat .v { font-size: 1.5rem; font-weight: 700; line-height: 1.3; color: var(--navy); }
.stat .s { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

.tgrp { margin-top: 22px; }
.tgrp h3 { font-size: 0.92rem; margin: 0 0 10px; color: var(--muted); font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.tile { display: flex; gap: 12px; align-items: flex-start; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; cursor: pointer; color: inherit; transition: all 0.15s; }
.tile:hover { border-color: var(--navy); background: var(--navy-soft); transform: translateY(-1px); }
.tile .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; flex: none; font-size: 1rem; }
.tile.fin .ic { background: var(--gA-bg); color: var(--gA); }
.tile.edu .ic { background: var(--red-soft); color: var(--red); }
.tile b { display: block; font-size: 0.95rem; font-weight: 700; color: var(--navy); }
.tile span { display: block; color: var(--muted); font-size: 0.8rem; line-height: 1.4; margin-top: 2px; }

/* Grade Ledger Grid */
.gridwrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); max-height: 75vh; }
table.grid { border-collapse: separate; border-spacing: 0; font-size: 0.88rem; min-width: 100%; }
.grid th, .grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; text-align: center; white-space: nowrap; }
.grid thead th { background: var(--navy-soft); position: sticky; top: 0; z-index: 2; font-weight: 700; padding: 6px 6px; vertical-align: bottom; color: var(--navy); }
.grid th.subj { writing-mode: vertical-rl; transform: rotate(180deg); height: 140px; font-size: 0.82rem; font-weight: 600; padding: 6px 4px; text-align: left; }
.grid .c-no { width: 38px; color: var(--muted); }
.grid .c-name { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; padding: 4px 10px; min-width: 170px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.grid thead .c-name { z-index: 3; background: var(--navy-soft); }
.grid td.cell input { width: 44px; border: 0; background: transparent; text-align: center; padding: 6px 2px; font-variant-numeric: tabular-nums; font-weight: 600; }
.grid td.cell input:focus { background: var(--marigold-soft); outline: 2px solid var(--marigold); outline-offset: -2px; }
.grid td.cell input.bad { background: var(--bad-bg); color: var(--bad); }
.grid td.cell input.low { color: var(--gE); }
.grid td.calc { padding: 4px 8px; font-variant-numeric: tabular-nums; background: var(--sunk); font-weight: 600; }
.grid td.avg { font-weight: 700; color: var(--navy); }
.grid tbody tr:hover td { background-color: rgba(13, 43, 107, 0.05); }
.grid tbody tr:hover td.c-name { background: var(--navy-soft); }
.grid tfoot td { background: var(--sunk); font-weight: 700; padding: 5px 4px; font-variant-numeric: tabular-nums; position: sticky; bottom: 0; }
.grid tfoot td.c-name { background: var(--sunk); z-index: 2; }

.gpill { display: inline-flex; gap: 4px; align-items: center; border-radius: 999px; padding: 1px 8px; font-size: 0.78rem; font-weight: 700; }
.gpill.A { background: var(--gA-bg); color: var(--gA); } .gpill.B { background: var(--gB-bg); color: var(--gB); } .gpill.C { background: var(--gC-bg); color: var(--gC); }
.gpill.D { background: var(--gD-bg); color: var(--gD); } .gpill.E { background: var(--gE-bg); color: var(--gE); } .gpill.F { background: var(--gF-bg); color: var(--gF); }

.rank { display: inline-block; min-width: 24px; color: var(--gE); font-weight: 700; }

.nmwrap { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; }
.nmwrap > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Document Previews */
.pv-wrap { width: 100%; position: relative; overflow: hidden; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); background: #fff; }

/* Printable Score Sheets & Paper View (A4 794x1123) */
.ss { width: 794px; height: 1123px; background: #fff; color: #101c33; font-family: var(--f-body); position: relative; overflow: hidden; }
.ss-in { position: absolute; inset: 26px 24px 22px; }
.ss-fit { transform-origin: top left; }
.ss-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.ss-school { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 220px; }
.ss-logo { width: 88px; height: 88px; object-fit: contain; margin-bottom: 2px; }

.ss-school .hs-sen { font-size: 11.5px; color: var(--red); font-weight: 700; letter-spacing: 0.02em; }
.ss-head .hs-kingdom { font-size: 14.5px; line-height: 2; text-align: center; font-family: var(--f-display); color: var(--navy); }

.ss-t th, .ss-t td { border: 1px solid #5b6678; text-align: center; padding: 0 2px; height: 21px; font-variant-numeric: tabular-nums; overflow: hidden; white-space: nowrap; }

.ss-t th.rot span { position: absolute; left: 50%; bottom: 6px; width: 108px; transform-origin: 0 0; transform: rotate(-90deg) translateY(-50%); text-align: left; font-size: 10.5px; line-height: 1.2; white-space: normal; }
