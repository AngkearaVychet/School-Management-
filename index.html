<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>សាលាអន្តរជាតិ ហេមតុន — ថ្នាក់រៀនអនឡាញ</title>
  <meta name="description" content="សាលាអន្តរជាតិ ហេមតុន — មេរៀន វីដេអូ និងឯកសារ សម្រាប់គ្រូ សិស្ស និងមាតាបិតា">
  <meta name="theme-color" content="#0d2b6b">
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="css/app.css?v=20261112h">
</head>
<body class="bg-slate-50 text-slate-800 font-khmer antialiased">

  <!-- Loading -->
  <div id="bootScreen" class="min-h-screen flex items-center justify-center">
    <div class="text-center">
      <img src="images/logo.png" alt="" class="w-20 h-20 mx-auto mb-4 object-contain animate-pulse">
      <p class="text-sm text-slate-500">កំពុងបើក...</p>
    </div>
  </div>

  <!-- ===== LOGIN ===== -->
  <div id="loginScreen" class="hidden min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-blue-950 via-blue-900 to-blue-800">
    <div class="w-full max-w-sm">
      <div class="text-center mb-6 text-white">
        <img src="images/logo.png" alt="Logo" class="w-24 h-24 mx-auto mb-3 object-contain drop-shadow-lg">
        <h1 class="text-2xl font-bold">សាលាអន្តរជាតិ ហេមតុន</h1>
        <p class="text-xs tracking-widest uppercase text-blue-200 mt-1">Hampton International School</p>
      </div>
      <form id="loginForm" class="bg-white rounded-2xl shadow-2xl p-6 space-y-4">
        <h2 class="text-lg font-bold text-blue-950 text-center">ចូលរៀន / ចូលប្រព័ន្ធ</h2>
        <label class="block">
          <span class="text-xs font-semibold text-slate-600">ឈ្មោះគណនី (Username)</span>
          <input name="username" autocomplete="username" autocapitalize="none" required class="field mt-1" placeholder="ឧ. sokha">
        </label>
        <label class="block">
          <span class="text-xs font-semibold text-slate-600">ពាក្យសម្ងាត់ (Password)</span>
          <input name="password" type="password" autocomplete="current-password" required class="field mt-1" placeholder="••••••">
        </label>
        <p id="loginError" class="hidden text-sm text-red-600 bg-red-50 rounded-lg px-3 py-2"></p>
        <button type="submit" class="btn-primary w-full py-2.5">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> ចូល
        </button>
        <p class="text-[11px] text-center text-slate-400">មិនទាន់មានគណនី? សូមទាក់ទងគ្រូ ឬការិយាល័យសាលា។</p>
      </form>
    </div>
  </div>

  <!-- ===== APP ===== -->
  <div id="appScreen" class="hidden min-h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
      <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
        <a href="#lessons" class="flex items-center gap-2.5 min-w-0">
          <img src="images/logo.png" alt="Logo" class="w-10 h-10 object-contain flex-shrink-0">
          <div class="min-w-0">
            <p class="font-bold text-blue-950 leading-tight truncate">សាលាអន្តរជាតិ ហេមតុន</p>
            <p class="text-[10px] font-semibold text-red-600 uppercase tracking-wider truncate hidden sm:block">Hampton International School</p>
          </div>
        </a>
        <div class="relative" id="userMenu">
          <button id="userMenuBtn" type="button" class="flex items-center gap-2 pl-1.5 pr-2.5 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-50" aria-haspopup="true">
            <span id="userAvatar" class="w-8 h-8 rounded-lg flex items-center justify-center text-white text-sm"></span>
            <span class="text-left hidden sm:block">
              <span id="userName" class="block text-xs font-bold text-slate-800 max-w-[160px] truncate"></span>
              <span id="userRole" class="block text-[10px] text-slate-500"></span>
            </span>
            <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
          </button>
          <div id="userDropdown" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-xl border border-slate-200 py-1.5 text-sm">
            <div class="px-4 py-2 border-b border-slate-100 sm:hidden">
              <p id="userNameMobile" class="font-bold text-slate-800 truncate"></p>
              <p id="userRoleMobile" class="text-xs text-slate-500"></p>
            </div>
            <button type="button" data-action="change-password" class="menu-item"><i class="fa-solid fa-key w-4"></i> ប្តូរពាក្យសម្ងាត់</button>
            <button type="button" data-action="logout" class="menu-item text-red-600"><i class="fa-solid fa-arrow-right-from-bracket w-4"></i> ចាកចេញ</button>
          </div>
        </div>
      </div>
      <nav id="tabs" class="max-w-6xl mx-auto px-4 flex gap-1 overflow-x-auto no-scrollbar"></nav>
    </header>

    <main id="view" class="flex-1 max-w-6xl w-full mx-auto px-4 py-6"></main>

    <footer class="border-t border-slate-200 bg-white py-5 text-center text-xs text-slate-400">
      © <span id="year"></span> សាលាអន្តរជាតិ ហេមតុន • Hampton International School
    </footer>
  </div>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 z-50 flex items-start sm:items-center justify-center p-0 sm:p-4">
    <div class="absolute inset-0 bg-slate-900/60" data-close></div>
    <div id="modalBox" class="relative bg-white w-full sm:rounded-2xl shadow-2xl max-h-screen sm:max-h-[92vh] overflow-y-auto"></div>
  </div>

  <!-- Toast -->
  <div id="toast" role="status" aria-live="polite" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-xl text-sm text-white shadow-lg opacity-0 pointer-events-none transition-opacity"></div>

  <script src="vendor/supabase.js"></script>
  <script src="js/config.js?v=20261112h"></script>
  <script src="js/app.js?v=20261112h"></script>
  <script src="js/worksheets.js?v=20261112h"></script>
</body>
</html>
