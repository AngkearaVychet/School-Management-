<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>កម្មវិធីគ្រប់គ្រងព័ត៌មាន និងចុះឈ្មោះសិស្ស</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Moul&display=swap">
<style>
/* Layout: a school register — navy header band with class/period pickers, then a ledger-style score grid with a sticky name column and a summary block underneath, mirroring the paper/Excel sheet. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#eef1f6; --line:#d9dfe8; --line-strong:#b9c3d3;
  --ink:#18202d; --muted:#5b6678; --navy:#1f3a68; --navy-ink:#ffffff; --navy-soft:#e3e9f4;
  --marigold:#c98a12; --marigold-soft:#fbf1dc;
  --gA:#1d7a4c; --gA-bg:#e1f3ea; --gB:#16707d; --gB-bg:#def1f3; --gC:#2c5aa0; --gC-bg:#e3ebf8;
  --gD:#9a6400; --gD-bg:#fbefd6; --gE:#b3352b; --gE-bg:#fbe4e1; --gF:#5b6678; --gF-bg:#eceff3;
  --bad:#b3352b; --bad-bg:#fbe4e1;
  --f-body:"Kantumruy Pro","Noto Sans Khmer","Khmer OS System","Leelawadee UI",system-ui,sans-serif;
  --f-display:"Moul","Khmer OS Muol Light","Kantumruy Pro",serif;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151d; --surface:#171e29; --sunk:#1d2532; --line:#2b3546; --line-strong:#3c495e;
  --ink:#e7ebf2; --muted:#9aa5b8; --navy:#26467c; --navy-ink:#ffffff; --navy-soft:#22314a;
  --marigold:#e6ad45; --marigold-soft:#3a2f17;
  --gA:#6fd3a0; --gA-bg:#173628; --gB:#6ccbd6; --gB-bg:#163339; --gC:#8fb3ef; --gC-bg:#1c2b45;
  --gD:#eabd63; --gD-bg:#3a2e14; --gE:#f08a80; --gE-bg:#3d1f1c; --gF:#9aa5b8; --gF-bg:#232b37;
  --bad:#f08a80; --bad-bg:#3d1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151d; --surface:#171e29; --sunk:#1d2532; --line:#2b3546; --line-strong:#3c495e;
  --ink:#e7ebf2; --muted:#9aa5b8; --navy:#26467c; --navy-ink:#ffffff; --navy-soft:#22314a;
  --marigold:#e6ad45; --marigold-soft:#3a2f17;
  --gA:#6fd3a0; --gA-bg:#173628; --gB:#6ccbd6; --gB-bg:#163339; --gC:#8fb3ef; --gC-bg:#1c2b45;
  --gD:#eabd63; --gD-bg:#3a2e14; --gE:#f08a80; --gE-bg:#3d1f1c; --gF:#9aa5b8; --gF-bg:#232b37;
  --bad:#f08a80; --bad-bg:#3d1f1c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

.band{background:var(--navy);color:var(--navy-ink)}
.band-in{max-width:1400px;margin:0 auto;padding-block:18px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:1.35rem;line-height:1.9;margin:0;text-wrap:balance}
.brand p{margin:0;opacity:.8;font-size:.85rem}
.pickers{display:flex;flex-wrap:wrap;gap:10px}
.pick{display:flex;flex-direction:column;gap:2px;min-width:0}
.pick[hidden]{display:none}
.pick label{font-size:.75rem;opacity:.8;letter-spacing:.02em}
.pick select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:6px;padding:6px 10px;min-width:150px;max-width:100%}
.pick select option{color:#18202d;background:#fff}
.who{display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:2px;font-size:.8rem;order:2}
.who button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:2px 10px;cursor:pointer;font-size:.8rem}
.locked .tabs,.locked .pick{display:none}
.tabs{display:flex;gap:4px;margin-top:16px;overflow-x:auto}
.tab{background:none;border:0;color:rgba(255,255,255,.75);padding:10px 16px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;font-weight:500}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--marigold);outline-offset:1px}

main{max-width:1400px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.note{background:var(--marigold-soft);border:1px solid var(--marigold);color:var(--ink);padding:10px 14px;border-radius:var(--r);font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{margin:0 0 4px;font-size:1.05rem;font-weight:600}
.panel .sub{margin:0 0 14px;color:var(--muted);font-size:.88rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:7px 14px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 10px;font-size:.85rem}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:.8rem;color:var(--muted)}
.inp{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0}
.status{font-size:.82rem;color:var(--muted)}
.status.err{color:var(--bad)}

/* summary strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .k{font-size:.8rem;color:var(--muted)}
.stat .v{font-size:1.5rem;font-weight:600;line-height:1.3}
.stat .s{font-size:.8rem;color:var(--muted)}
.dist{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--sunk);margin-top:8px}
.dist span{display:block;height:100%}

/* grade grid */
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:75vh}
table.grid{border-collapse:separate;border-spacing:0;font-size:.88rem;min-width:100%}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
.grid thead th{background:var(--navy-soft);position:sticky;top:0;z-index:2;font-weight:600;padding:6px 6px;vertical-align:bottom}
.grid thead tr.r2 th{top:var(--h1,34px)}
.grid th.grp{font-size:.78rem;color:var(--muted);font-weight:500;border-bottom-color:var(--line-strong)}
.grid th.subj{writing-mode:vertical-rl;transform:rotate(180deg);height:150px;font-size:.82rem;font-weight:500;padding:6px 4px;text-align:left}
.grid .c-no{width:40px;color:var(--muted)}
.grid .c-name{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:4px 10px;min-width:170px;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.grid thead .c-name{z-index:3;background:var(--navy-soft)}
.grid .c-g{width:38px}
.grid td.cell input{width:46px;border:0;background:transparent;text-align:center;padding:6px 2px;font-variant-numeric:tabular-nums}
.grid td.cell input:focus{background:var(--marigold-soft);outline:2px solid var(--marigold);outline-offset:-2px}
.grid td.cell input.bad{background:var(--bad-bg);color:var(--bad)}
.grid td.cell input.low{color:var(--gE)}
.grid td.calc{padding:4px 8px;font-variant-numeric:tabular-nums;background:var(--sunk)}
.grid td.avg{font-weight:600}
.grid tbody tr:hover td{background-color:color-mix(in srgb,var(--navy-soft) 45%,transparent)}
.grid tbody tr:hover td.c-name{background:var(--navy-soft)}
.grid tfoot td{background:var(--sunk);font-weight:500;padding:5px 4px;font-variant-numeric:tabular-nums;position:sticky;bottom:0}
.grid tfoot td.c-name{background:var(--sunk);z-index:2}
.rank{display:inline-block;min-width:26px;color:var(--gE);font-weight:700}
.rank.top{background:var(--gE);color:var(--surface);border-radius:999px;padding:0 6px}
.gpill{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:600}
.gpill b{font-weight:700}
.gpill.A{background:var(--gA-bg);color:var(--gA)}.gpill.B{background:var(--gB-bg);color:var(--gB)}.gpill.C{background:var(--gC-bg);color:var(--gC)}
.gpill.D{background:var(--gD-bg);color:var(--gD)}.gpill.E{background:var(--gE-bg);color:var(--gE)}.gpill.F{background:var(--gF-bg);color:var(--gF)}
.sw-A{background:var(--gA)}.sw-B{background:var(--gB)}.sw-C{background:var(--gC)}.sw-D{background:var(--gD)}.sw-E{background:var(--gE)}.sw-F{background:var(--gF)}
.hint{font-size:.8rem;color:var(--muted)}

/* summary table like the old sheet */
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:760px){.sumgrid{grid-template-columns:1fr}}
.tbl{overflow-x:auto}
table.plain{border-collapse:collapse;width:100%;font-size:.9rem}
.plain th,.plain td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
.plain th{color:var(--muted);font-weight:500;font-size:.8rem}
.plain td.n{text-align:right;font-variant-numeric:tabular-nums}

/* students */
.slist{display:flex;flex-direction:column;gap:0}
.av{--s:28px;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;flex:none;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
  background:var(--navy-soft);color:var(--navy);font-weight:700;font-size:calc(var(--s) * .42);border:1.5px solid var(--line-strong)}
.av img{width:100%;height:100%;object-fit:cover}
.av i{font-style:normal}
.av.btn-av{cursor:pointer;position:relative}
.av.btn-av:hover{outline:2px solid var(--marigold);outline-offset:1px}
.nmwrap{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.nmwrap>span:last-child{overflow:hidden;text-overflow:ellipsis}
.rc-top{display:flex;gap:18px;align-items:flex-start;justify-content:space-between}
.rc-top .meta{flex:1}
/* student details on two lines, written on dotted lines like a printed form */
.rc-fill{flex:1;min-width:0;align-self:center;display:grid;grid-template-columns:auto minmax(0,1fr) auto 26%;column-gap:8px;row-gap:16px;align-items:end;margin:14px 0 16px;font-size:1rem;line-height:1.7}
.rc-fill .lb{white-space:nowrap;color:var(--ink,#1d2433);font-weight:600}
.rc-fill .lb.l2{margin-left:18px}
.rc-fill .dl{min-width:0;border-bottom:2px dotted #5b6475;padding:0 8px 2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#13306b}
.rc-fill .dl.nm{font-weight:700;font-size:1.06em}
.rc-photo{width:96px;height:120px;border:2px solid #c9971c;padding:3px;background:#fff;flex:none;margin-top:14px}
.rc-photo>span{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#eef2f9;color:#7a8496;font-size:11px;text-align:center}
.rc-photo img{width:100%;height:100%;object-fit:cover;display:block}
.nb .av{--s:26px;border-color:#c9971c;background:#eef2f9;color:#1c3566}
.srow{display:grid;grid-template-columns:36px 46px minmax(0,1fr) 92px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow .no{color:var(--muted);text-align:right}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}
textarea.inp{width:100%;min-height:150px;resize:vertical}

/* report card */
.rc-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.rc-layout{grid-template-columns:1fr}}
.rc-list{display:flex;flex-direction:column;max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.rc-item{display:flex;gap:8px;align-items:center;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.rc-item:hover{background:var(--sunk)}
.rc-item[aria-current="true"]{background:var(--navy-soft);font-weight:600}
.rc-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:28px clamp(16px,4vw,40px);min-width:0}
.card .ss-head{flex-wrap:wrap}
.card .ss-school{min-width:0}
@media (max-width:560px){.card .ss-head{flex-direction:column-reverse;align-items:center}.card .hs-kingdom{text-align:center}}
.card .kingdom{text-align:center;font-family:var(--f-display);font-size:.95rem;line-height:2}
.card .motto{text-align:center;font-size:.85rem;color:var(--muted)}
.card h3{text-align:center;font-family:var(--f-display);font-weight:400;font-size:1.1rem;margin:18px 0 6px;line-height:2}
.card .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 20px;margin:14px 0 16px;font-size:.92rem}
.card .meta span{color:var(--muted)}
.card .res{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}
.card .res div{border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.card .res .k{font-size:.78rem;color:var(--muted)}
.card .res .v{font-size:1.2rem;font-weight:600}
.sign{display:flex;justify-content:space-between;gap:20px;margin-top:34px;font-size:.88rem;flex-wrap:wrap}
.sign div{text-align:center;min-width:160px}
.sign div p{margin:0 0 50px}

/* settings */
.sub-row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,140px) auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.cls-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.srow{grid-template-columns:28px 46px minmax(0,1fr)}.srow>select,.srow>.row{grid-column:3}.cls-row{grid-template-columns:1fr 1fr}.sub-row{grid-template-columns:28px minmax(0,1fr) auto}.sub-row .grpin{display:none}}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h2{color:var(--ink)}
/* attendance */
.att-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.att-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.att-date{font-weight:600;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:600;font-variant-numeric:tabular-nums}
.chip.P{background:var(--gA-bg);color:var(--gA)}.chip.L{background:var(--gD-bg);color:var(--gD)}.chip.E{background:var(--gC-bg);color:var(--gC)}.chip.A{background:var(--gE-bg);color:var(--gE)}.chip.N{background:var(--gF-bg);color:var(--gF)}
.att-list{display:flex;flex-direction:column}
.att-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.att-row .no{color:var(--muted);text-align:right}
.att-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.att-row{grid-template-columns:30px minmax(0,1fr)}.att-row .seg{grid-column:2}}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--line);background:none;padding:6px 12px;cursor:pointer;font-size:.88rem;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--sunk)}
.seg button[aria-pressed="true"].P{background:var(--gA-bg);color:var(--gA);font-weight:600}
.seg button[aria-pressed="true"].L{background:var(--gD-bg);color:var(--gD);font-weight:600}
.seg button[aria-pressed="true"].E{background:var(--gC-bg);color:var(--gC);font-weight:600}
.seg button[aria-pressed="true"].A{background:var(--gE-bg);color:var(--gE);font-weight:600}
.seg button:disabled{cursor:default}
.untaken .seg button[aria-pressed="true"].P{background:none;color:var(--muted);font-weight:400}
table.attg{border-collapse:separate;border-spacing:0;font-size:.82rem}
.attg th,.attg td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:3px 0;min-width:26px;font-variant-numeric:tabular-nums}
.attg thead th{background:var(--navy-soft);position:sticky;top:0;z-index:2;font-weight:600;padding:4px 2px}
.attg .c-name{position:sticky;left:0;background:var(--surface);text-align:left;padding:3px 10px;min-width:160px;white-space:nowrap;z-index:1}
.attg thead .c-name{background:var(--navy-soft);z-index:3}
.attg .sun{background:var(--sunk)}
.attg td.off{color:var(--line-strong)}
.attg td.L{color:var(--gD);font-weight:700}.attg td.E{color:var(--gC);font-weight:700}.attg td.A{color:var(--gE);font-weight:700}
.attg td.tot{background:var(--sunk);font-weight:600;min-width:38px}
/* documents always print on white paper, whatever the app theme */
.paper{--bg:#ffffff;--surface:#ffffff;--sunk:#f1f4f9;--line:#d9dfe8;--line-strong:#b9c3d3;--ink:#18202d;--muted:#5b6678;--navy-soft:#e3e9f4;
  --gA:#1d7a4c;--gA-bg:#e1f3ea;--gB:#16707d;--gB-bg:#def1f3;--gC:#2c5aa0;--gC-bg:#e3ebf8;--gD:#9a6400;--gD-bg:#fbefd6;--gE:#b3352b;--gE-bg:#fbe4e1;--gF:#5b6678;--gF-bg:#eceff3;
  color-scheme:light;background:#ffffff;color:#18202d}
.pv-wrap{width:100%;position:relative;overflow:hidden;border-radius:4px;box-shadow:0 2px 16px rgba(0,0,0,.18);background:#fff}
.pv-wrap>.ss{position:absolute;left:0;top:0;transform-origin:top left}
.doc-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* notice board sheet */
table.nb{border-collapse:collapse;width:100%;font-size:15px}
.nb th,.nb td{border:1px solid #5b6678;padding:3px 8px;height:30px;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.nb thead th{background:#1c3566;color:#fff;font-weight:600}
.nb td.nm{text-align:left;font-weight:500}
.nb tr.toprow td{background:#fdf3d8}
.nb .medal{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;background:#b3261e;color:#fff;font-weight:700;font-size:13px;border:2px solid #c9971c}
.nb td.fail{color:#b3261e;font-weight:600}
.nb td.pass{color:#1d7a4c;font-weight:600}
.nb-note{text-align:center;font-size:13px;color:#5b6678;margin:-4px 0 10px}
.nb-sum{display:flex;justify-content:center;gap:22px;font-size:13px;margin-top:10px;color:#1c3566;font-weight:600}
/* printable score sheet (A4 portrait, one page, paper look) */
.ss{width:794px;height:1123px;background:var(--hs-paper);color:var(--hs-ink);font-family:var(--f-body);position:relative;overflow:hidden}
.ss-in{position:absolute;inset:28px 26px 24px}
.ss-fit{transform-origin:top left}
.ss-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.ss-school{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:220px}
.ss-logo{width:92px;height:92px;object-fit:contain;display:block;margin-bottom:4px}
.ss-school .hs-skh{font-size:14px;line-height:1.9}
.ss-school .hs-sen{font-size:12.5px;letter-spacing:.02em}
.ss-head .hs-kingdom{font-size:15px;padding-top:2px}
.ss-br{font-size:12px;color:#1c3566;font-weight:700;margin-top:2px}
.sb-branch{margin-top:10px;width:100%}
.sb-branch label{display:block;font-size:.7rem;color:var(--marigold);letter-spacing:.05em;margin-bottom:2px;font-weight:700}
.sb-branch select{width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 8px}
.sb-branch select option{color:#18202d;background:#fff}
.sb-brname{font-size:.78rem;margin-top:6px;color:var(--marigold);font-weight:700}
.brow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
@media (max-width:760px){.brow{grid-template-columns:1fr 1fr}}
.ss-rule{margin:8px 0 6px;border-top:2px solid var(--hs-navy);border-bottom:1px solid var(--hs-gold);height:3px}
.ss-title{font-family:var(--f-display);font-weight:400;text-align:center;color:var(--hs-navy);font-size:21px;line-height:1.9;margin:4px 0 0}
.ss-sub{text-align:center;color:var(--hs-red);font-size:14px;font-weight:600;margin-bottom:10px}
table.ss-t{border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.ss-t th,.ss-t td{border:1px solid #5b6678;text-align:center;padding:0 2px;height:21px;font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap}
.ss-t thead th{background:#e3e9f4;color:var(--hs-navy);font-weight:600}
.ss-t th.rot{height:118px;padding:0;position:relative}
.ss-t th.rot span{position:absolute;left:50%;bottom:6px;width:112px;transform-origin:0 0;transform:rotate(-90deg) translateY(-50%);text-align:left;font-size:10.5px;line-height:1.2;white-space:normal}
.ss-t td.nm{text-align:left;padding-left:6px;text-overflow:ellipsis}
.ss-t td.calc{background:#f1f4f9;font-weight:600}
.ss-t td.rk,.nb td.rk{color:#b3261e;font-weight:700}
.ss-t tr.avgrow td{background:#f1f4f9;font-weight:600}
.ss-foot{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-top:12px;font-size:11.5px}
.ss-sum{border-collapse:collapse}
.ss-sum td{border:1px solid #b9c3d3;padding:1px 7px;font-variant-numeric:tabular-nums}
.ss-sum td.n{text-align:right}
.ss-signs{display:flex;justify-content:space-between;margin-top:14px;font-size:12px}
.ss-sign{text-align:center;min-width:220px}
.ss-sign .ttl{font-family:var(--f-display);color:var(--hs-navy);line-height:2}
.ss-sign .sp{height:58px}
.ss-sign .nm{font-weight:700;color:var(--hs-navy)}
.logo-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.logo-box .pv{width:84px;height:84px;border:1px dashed var(--line-strong);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;color:#7a8496;font-size:.8rem}
.logo-box .pv img{max-width:100%;max-height:100%;object-fit:contain}
/* honor roll — a printed certificate, so it keeps one paper look in both themes */
:root{--hs-paper:#ffffff;--hs-navy:#1c3566;--hs-red:#b3261e;--hs-gold:#c9971c;--hs-gold2:#f3d27a;--hs-ink:#1b2230;--hs-soft:#eef2f9}
.hon-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.hon-layout{grid-template-columns:1fr}}
.hon-form{display:flex;flex-direction:column;gap:12px}
.hon-form h3{margin:6px 0 0;font-size:.92rem;font-weight:600}
.hs-wrap{width:100%;position:relative;overflow:hidden;border-radius:4px;box-shadow:0 2px 16px rgba(0,0,0,.18);background:#fff}
.hs-wrap>.hs{position:absolute;left:0;top:0;transform-origin:top left}
.hs{width:794px;height:1123px;background:#fff;color:var(--hs-ink);position:relative;font-family:var(--f-body);overflow:hidden}
/* frame: navy band, white gap, gold line, fine navy line, with gold corner diamonds */
.hs-bd1{position:absolute;inset:14px;border:7px solid var(--hs-navy)}
.hs-bd2{position:absolute;inset:27px;border:2px solid var(--hs-gold)}
.hs-bd3{position:absolute;inset:33px;border:1px solid var(--hs-navy)}
.hs-cn{position:absolute;width:26px;height:26px;background:var(--hs-gold);transform:rotate(45deg);border:2px solid #fff}
.hs-cn::after{content:"";position:absolute;inset:6px;background:var(--hs-navy)}
.hs-cn.tl{left:15px;top:15px}.hs-cn.tr{right:15px;top:15px}.hs-cn.bl{left:15px;bottom:15px}.hs-cn.br{right:15px;bottom:15px}
.hs-mid{position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;background:var(--hs-gold);transform:rotate(45deg);border:2px solid #fff}
.hs-mid.t{top:20px}.hs-mid.b{bottom:20px}
.hs-wm{position:absolute;left:50%;top:56%;width:430px;height:430px;margin:-215px 0 0 -215px;object-fit:contain;opacity:.06}
.hs-frame{position:absolute;inset:44px 48px 40px;display:flex;flex-direction:column}
.hs-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.hs-school{width:230px;text-align:center}
.hs-logo{width:80px;height:80px;margin:0 auto 2px;display:flex;align-items:center;justify-content:center;color:var(--hs-navy);font-size:11px;border:1px dashed var(--hs-navy);border-radius:50%}
.hs-logo.has{border:0}
.hs-logo img{width:100%;height:100%;object-fit:contain}
.hs-skh{font-family:var(--f-display);font-size:13px;color:var(--hs-navy);line-height:1.9}
.hs-sen{font-size:12px;color:var(--hs-red);font-weight:700;letter-spacing:.02em}
.hs-kingdom{text-align:center;font-family:var(--f-display);color:var(--hs-navy);font-size:15px;line-height:2.1;padding-top:4px}
.hs-kingdom .orn{font-family:var(--f-body);color:var(--hs-gold);letter-spacing:6px;font-size:13px;line-height:1}
.hs-titlebox{text-align:center;margin-top:2px}
.hs-kicker{font-family:var(--f-display);color:var(--hs-navy);font-size:36px;line-height:1.7;letter-spacing:.02em}
.hs-divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 2px;width:420px}
.hs-divider span{flex:1;height:2px;background:var(--hs-gold)}
.hs-divider i{width:12px;height:12px;background:var(--hs-gold);transform:rotate(45deg);border:2px solid var(--hs-navy)}
.hs-period{font-family:var(--f-display);color:var(--hs-red);font-size:20px;line-height:2}
.hs-sub{font-size:15px;color:var(--hs-navy);font-weight:600;line-height:1.6}
.hs-podium{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:4px 0}
.hs-row{display:flex;justify-content:space-around;align-items:flex-start}
.hs-row.one{justify-content:center}
.hs-slot{display:flex;flex-direction:column;align-items:center;flex:0 1 var(--sw,220px);min-width:0}
.hs-slot{--mw:max(30px,calc(var(--pw) * .34))}
.hs-slot.first{--pw:var(--pw1);--mw:max(34px,calc(var(--pw1) * .32))}
.hs-pf{border:1px solid var(--hs-navy);padding:2px;background:#fff}
.hs-photo{position:relative;width:var(--pw,128px);height:calc(var(--pw,128px) * 1.25);background:var(--hs-soft);border:3px solid var(--hs-gold);display:flex;align-items:center;justify-content:center;color:var(--hs-navy);font-size:12px;text-align:center;overflow:hidden}
.hs-photo img{width:100%;height:100%;object-fit:cover;display:block}
.hs-photo.edit{cursor:pointer}
.hs-photo.edit:hover::after{content:"ប្ដូររូបថត";position:absolute;inset:0;background:rgba(28,53,102,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.hs-medalwrap{position:relative;height:calc(var(--mw) * .55);width:var(--mw);margin-top:calc(var(--mw) * -.45)}
.hs-tail{position:absolute;top:calc(var(--mw) * .55);width:calc(var(--mw) * .3);height:calc(var(--mw) * .55)}
.hs-tail.l{left:calc(var(--mw) * .18);background:var(--hs-red);transform:rotate(18deg)}
.hs-tail.r{right:calc(var(--mw) * .18);background:var(--hs-navy);transform:rotate(-18deg)}
.hs-medal{position:absolute;left:0;top:0;width:var(--mw);height:var(--mw);border-radius:50%;background:var(--hs-gold);border:3px solid var(--hs-navy);color:var(--hs-navy);
  font-family:var(--f-display);display:flex;align-items:center;justify-content:center;font-size:calc(var(--mw) * .44);line-height:1}
.hs-medal b{position:absolute;inset:3px;border-radius:50%;border:1px solid #fff}
.hs-name{margin-top:calc(var(--mw) * .62);background:var(--hs-navy);color:#fff;padding:2px 18px;border-radius:999px;border:2px solid var(--hs-gold);font-weight:700;font-size:15px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.hs-slot.first .hs-name{font-size:17px}
.hs-slot.ghost{visibility:hidden}
.hs-score{font-size:12px;color:var(--hs-navy);margin-top:2px;white-space:nowrap}
.hs-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;font-size:13px}
.hs-foot .col{text-align:center;min-width:230px}
.hs-foot .ttl{font-family:var(--f-display);color:var(--hs-navy);font-size:13px;line-height:2;margin-top:2px}
.hs-foot .sp{height:48px}
.hs-foot .nm{font-weight:700;color:var(--hs-navy)}
.hs-dots{color:#7a8496}
.hs-empty{text-align:center;color:#7a8496;font-size:16px;padding:60px}
.guide .steps{margin:4px 0 10px;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.guide .seelist{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.urow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.urow .ucls{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:640px){.urow{grid-template-columns:1fr}}
.ufrm{display:flex;flex-direction:column;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.ufrm h3{margin:0;font-size:.95rem}
.cbxs{display:flex;flex-wrap:wrap;gap:8px}
.cbx{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line-strong);border-radius:8px;padding:5px 10px;cursor:pointer}
.cbx:has(input:checked){background:var(--navy-soft);border-color:var(--navy)}
/* app shell: sidebar with the school's identity, content on the right */
.app{display:flex;min-height:100vh;min-height:100dvh}
.side{width:252px;flex:none;background:var(--navy);color:#fff;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;
  padding-block:20px calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;z-index:30}
.side-brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:4px 6px 16px;border-bottom:1px solid rgba(255,255,255,.16);margin-bottom:6px}
.sb-logo{width:78px;height:78px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#1f3a68;font-family:var(--f-display);font-size:.8rem;
  box-shadow:0 0 0 3px rgba(255,255,255,.18),0 0 0 5px var(--marigold)}
.sb-logo img{width:100%;height:100%;object-fit:contain}
.sb-kh{font-family:var(--f-display);font-size:.95rem;line-height:1.9;margin-top:10px;text-wrap:balance}
.sb-en{font-size:.74rem;opacity:.78;letter-spacing:.02em}
.sn-grp{font-size:.72rem;letter-spacing:.06em;color:var(--marigold);margin:14px 10px 4px;font-weight:700}
.side .tab{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:8px 12px;border-radius:8px;color:rgba(255,255,255,.84);background:none;border:0;cursor:pointer;font-weight:500;line-height:1.5}
.side .tab:hover{background:rgba(255,255,255,.09);color:#fff}
.side .tab[aria-selected="true"]{background:#fff;color:#1f3a68;font-weight:600}
.side .tab svg{width:18px;height:18px;flex:none}
.side .tab:focus-visible{outline:2px solid var(--marigold);outline-offset:1px}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.16)}
.side-foot .who{align-items:flex-start;color:#fff}
.shell{flex:1;min-width:0;display:flex;flex-direction:column}
.shell>main{width:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tb-title{flex:1;min-width:160px}
.tb-title h1{font-size:1.15rem;margin:0;font-weight:700;line-height:1.5}
.tb-title p{margin:0;color:var(--muted);font-size:.8rem}
.topbar .pickers{display:flex;flex-wrap:wrap;gap:10px}
.topbar .pick label{color:var(--muted);opacity:1}
.topbar .pick select{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);min-width:140px}
.topbar .pick select option{color:var(--ink);background:var(--surface)}
.menu-btn{display:none;background:none;border:1px solid var(--line-strong);border-radius:8px;padding:6px;color:var(--ink);cursor:pointer}
.scrim{display:none}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%);box-shadow:0 0 30px rgba(0,0,0,.3)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:25}
  .menu-btn{display:inline-flex}
}
@media (prefers-reduced-motion:no-preference){.side{transition:transform .2s ease}}
.locked .side,.locked .topbar .pickers,.locked .menu-btn{display:none}
/* home */
.hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,3vw,30px);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:26px solid var(--navy-soft)}
.hero .hlogo{width:104px;height:104px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 4px var(--navy-soft),0 0 0 6px var(--marigold);flex:none;position:relative;z-index:1;color:#1f3a68}
.hero .hlogo img{width:100%;height:100%;object-fit:contain}
.hero .hlogo svg{width:44px;height:44px}
.hero .htxt{position:relative;z-index:1;min-width:0}
.hero h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem;line-height:1.9;margin:0;color:var(--navy);text-wrap:balance}
.hero .en{color:var(--gE);font-weight:700;letter-spacing:.02em}
.hero .meta{color:var(--muted);font-size:.9rem;margin-top:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero h2{color:var(--ink)}}
:root[data-theme="dark"] .hero h2{color:var(--ink)}
.tgrp{margin-top:22px}
.tgrp h3{font-size:.95rem;margin:0 0 10px;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;color:inherit}
.tile:hover{border-color:var(--navy);background:var(--navy-soft)}
.tile:focus-visible{outline:2px solid var(--marigold);outline-offset:1px}
.tile .ic{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.tile.fin .ic{background:var(--gA-bg);color:var(--gA)}
.tile .ic svg{width:20px;height:20px}
.tile b{display:block;font-size:.98rem}
.tile span{display:block;color:var(--muted);font-size:.82rem;line-height:1.5;margin-top:2px}
/* finance */
.modesw{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden;align-self:flex-end}
.modesw button{background:none;border:0;color:rgba(255,255,255,.8);padding:6px 14px;cursor:pointer;font-weight:600}
.modesw button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px;align-items:end;margin-top:10px}
.fgrid .field.wide{grid-column:span 2}
@media (max-width:520px){.fgrid .field.wide{grid-column:span 1}}
.fgrid .fbtns{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table.ftab{border-collapse:separate;border-spacing:0;font-size:.88rem;min-width:100%}
.ftab th,.ftab td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.ftab thead th{background:var(--navy-soft);position:sticky;top:0;font-weight:600;z-index:1}
.ftab .l{text-align:left}.ftab .r{text-align:right}
.ftab td.muted{color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis}
.ftab tr.editing td{background:var(--marigold-soft)}
.ftab td.acts{display:flex;gap:4px;justify-content:flex-end}
.ftab tfoot td{background:var(--sunk);font-weight:600;position:sticky;bottom:0}
.ftab td.neg{color:var(--gE)}
.ftab td.pm.ok{background:var(--gA-bg);color:var(--gA)}.ftab td.pm.part{background:var(--gD-bg);color:var(--gD)}.ftab td.pm.none{background:var(--gE-bg);color:var(--gE)}
.ysum tr.sec td{background:var(--sunk);font-weight:700;color:var(--navy)}
.ysum tr.tot td{font-weight:700;border-bottom:2px solid var(--line-strong)}
.fchart{width:100%;min-width:560px;height:auto;display:block}
.fchart .grid{stroke:var(--line);stroke-width:1}
.fchart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.fchart .bin{fill:var(--gA)}.fchart .bout{fill:var(--gE)}
table.fr{border-collapse:collapse;width:100%;font-size:11.5px;margin-top:8px}
.fr th,.fr td{border:1px solid #b9c3d3;padding:2px 7px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fr thead th{background:#1c3566;color:#fff;font-weight:600}
.fr .l{text-align:left;white-space:normal}
.fr tr.tot td{background:#eef2f9;font-weight:700}
.fr td.neg{color:#b3261e}
.fr-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fr-warn{color:#b3261e;font-size:11px;margin:6px 0 0}
.fr-signs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center;font-size:12px;margin-top:14px}
.fr-signs .sp{height:46px}.fr-signs .nm{font-weight:700;color:#1c3566}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:.9rem;z-index:20}
@media (prefers-reduced-motion:no-preference){.tab,.btn{transition:background .15s}}
.idc-layout{grid-template-columns:320px minmax(0,1fr)}
.idc-right{min-width:0}
.idc-prev{max-width:280px;margin:4px auto 0;width:100%}
.idc-prev canvas{width:100%;height:auto;display:block;border-radius:12px;box-shadow:0 4px 22px rgba(0,0,0,.2);background:#fff}
.idc-tab td,.idc-tab th{padding:5px 6px;vertical-align:middle}
.idc-tab tr[data-id]{cursor:pointer}
.idc-tab tr.on td{background:var(--navy-soft)}
.idc-tab .inp.sm{padding:4px 8px;min-width:0;width:100%;font-size:.88rem}
.idc-tab td:nth-child(4){min-width:120px}.idc-tab td:nth-child(5){min-width:110px}
.idc-tpl summary{cursor:pointer;color:var(--muted)}
@media (max-width:900px){.idc-layout{grid-template-columns:1fr}}
.cert-layout{grid-template-columns:360px minmax(0,1fr)}
.cert-layout .hon-form .row>.field{margin:0}
.clist{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:4px}
.crow{display:grid;grid-template-columns:22px 28px minmax(0,1fr) auto;gap:6px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer}
.crow:hover{background:var(--navy-soft)}

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const PNAME={e1m:"ប្រឡងពាក់កណ្ដាលវគ្គ១",e1f:"ប្រឡងបញ្ចប់វគ្គ១",e2m:"ប្រឡងពាក់កណ្ដាលវគ្គ២",e2f:"ប្រឡងបញ្ចប់វគ្គ២",m09:"ខែកញ្ញា",m10:"ខែតុលា",m11:"ខែវិច្ឆិកា",m12:"ខែធ្នូ",q1:"ត្រីមាសទី១",m01:"ខែមករា",m02:"ខែកុម្ភៈ",m03:"ខែមីនា",s1:"ឆមាសទី១",
 m04:"ខែមេសា",m05:"ខែឧសភា",m06:"ខែមិថុនា",q2:"ត្រីមាសទី២",m07:"ខែកក្កដា",m08:"ខែសីហា",s2:"ឆមាសទី២"};
const MONTH_EN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const PNAME_EN={e1m:"Midterm Exam · Course 1",e1f:"Final Exam · Course 1",e2m:"Midterm Exam · Course 2",e2f:"Final Exam · Course 2",
 q1:"Quarter 1",q2:"Quarter 2",s1:"Semester 1",s2:"Semester 2"};
for(let i=1;i<=12;i++)PNAME_EN["m"+String(i).padStart(2,"0")]=MONTH_EN[i-1];
// English section: two 6-month courses (September–February, March–August), each with a midterm and a final exam
const ENG_PERIODS=["m09","m10","m11","e1m","m12","m01","m02","e1f","m03","m04","m05","e2m","m06","m07","m08","e2f"];
const ENG_GRADES=[["A","Excellent","A"],["B","Very Good","B"],["C","Good","C"],["D","Fair","D"],["E","Pass","E"],["F","Fail","F"]];
const ENG_SCALE=[["A","91 – 100"],["B","81 – 90"],["C","71 – 80"],["D","61 – 70"],["E","50 – 60"],["F","0 – 49"]];
const ENG_GRADE=a=>a>=91?"A":a>=81?"B":a>=71?"C":a>=61?"D":a>=50?"E":"F";
const KINDS={
 eng_k:{name:"English មត្តេយ្យ (Pre-Nursery – K4)",en:true,letters:true,avgMode:"pct",pass:50,periods:ENG_PERIODS,grades:ENG_GRADES,scale:ENG_SCALE,grade:ENG_GRADE},

   scale:[["A","៩.៥ – ១០"],["B","៨ – ៩.៤៩"],["C","៦.៥ – ៧.៩៩"],["D","៥ – ៦.៤៩"],["E","តិចជាង ៥"],["F","០"]],
   grade:a=>a<=0?"F":a<5?"E":a<6.5?"D":a<8?"C":a<9.5?"B":"A"},
 kinder:{name:"មត្តេយ្យ",letters:false,avgMode:"all",
   periods:["m09","m10","q1","m12","m01","s1","m03","m04","q2","m06","m07","s2"],
   grades:[["G","ល្អ","B"],["P","ល្អបង្គួរ","C"],["M","មធ្យម","D"],["W","ខ្សោយ","E"]],
   scale:[["G","៨ – ១០"],["P","៦.៥ – ៧.៩៩"],["M","៥ – ៦.៤៩"],["W","តិចជាង ៥"]],
   grade:a=>a>=8?"G":a>=6.5?"P":a>=5?"M":"W"}
};
const ALL_PERIODS=Object.keys(PNAME);
const ENG_K_SUBJECTS=[
 {key:"e01",name:"English",max:100,group:"Main Subjects"},{key:"e02",name:"Math",max:100,group:"Main Subjects"},{key:"e03",name:"Science",max:100,group:"Main Subjects"},
 {key:"e04",name:"Social Studies",max:100,group:"Main Subjects"},{key:"e05",name:"Arts",max:50,group:"Main Subjects"},
 {key:"e06",name:"PE",max:10,group:"Other Tasks"},{key:"e07",name:"Att",max:10,group:"Other Tasks"},{key:"e08",name:"CP",max:10,group:"Other Tasks"},
 {key:"e09",name:"Homework",max:10,group:"Other Tasks"},{key:"e10",name:"Morality",max:10,group:"Other Tasks"}];
const ENG_P_SUBJECTS=[
 {key:"g01",name:"Reading",max:50,group:"Main Subjects"},{key:"g02",name:"Listening",max:50,group:"Main Subjects"},{key:"g03",name:"Speaking",max:50,group:"Main Subjects"},
 {key:"g04",name:"Writing",max:50,group:"Main Subjects"},{key:"g05",name:"Math",max:100,group:"Main Subjects"},{key:"g06",name:"Science",max:100,group:"Main Subjects"},
 {key:"g07",name:"Grammar",max:50,group:"Main Subjects"},{key:"g08",name:"Vocabulary",max:50,group:"Main Subjects"},
 {key:"g09",name:"Att",max:10,group:"Other Tasks"},{key:"g10",name:"Class Participation",max:10,group:"Other Tasks"},{key:"g11",name:"Homework",max:10,group:"Other Tasks"},
 {key:"g12",name:"PE",max:10,group:"Other Tasks"},{key:"g13",name:"Morality",max:10,group:"Other Tasks"}];
const smax=sb=>+(sb&&sb.max)||10;
const KINDER_SUBJECTS=[
 {key:"k01",name:"រៀនអាន",group:""},{key:"k02",name:"សរសេរតាមអាន",group:""},{key:"k03",name:"គណិតវិទ្យា",group:""},
 {key:"k04",name:"ពលរដ្ឋ-សីលធម៌",group:""},{key:"k05",name:"គំនូរ",group:""},{key:"k06",name:"តន្ត្រី របាំ ចម្រៀង",group:""},
 {key:"k07",name:"កីឡា និងហត្ថកម្ម",group:""},{key:"k08",name:"វត្តមាន",group:""},{key:"k09",name:"កិច្ចការផ្ទះ",group:""},{key:"k10",name:"កិច្ចការសាលា",group:""}
];
const DEFAULT_SUBJECTS=[
 {key:"s01",name:"សមត្ថភាពស្តាប់",group:"ភាសាខ្មែរ"},{key:"s02",name:"សមត្ថភាពសរសេរ",group:"ភាសាខ្មែរ"},
 {key:"s03",name:"សមត្ថភាពអាន",group:"ភាសាខ្មែរ"},{key:"s04",name:"សមត្ថភាពនិយាយ",group:"ភាសាខ្មែរ"},
 {key:"s05",name:"ចំនួន",group:"គណិតវិទ្យា"},{key:"s06",name:"រង្វាស់រង្វាល់",group:"គណិតវិទ្យា"},
 {key:"s07",name:"ធរណីមាត្រ",group:"គណិតវិទ្យា"},{key:"s08",name:"ពីជគណិត",group:"គណិតវិទ្យា"},{key:"s09",name:"ស្ថិតិ",group:"គណិតវិទ្យា"},
 {key:"s10",name:"វិទ្យាសាស្ត្រ",group:""},{key:"s11",name:"សិក្សាសង្គម",group:""},{key:"s12",name:"គេហៈ-អប់រំសិល្បៈ",group:""},
 {key:"s13",name:"អប់រំកាយ-កីឡា",group:""},{key:"s14",name:"សុខភាព-អនាម័យ",group:""},{key:"s15",name:"គំនូរ-ហត្ថកម្ម",group:""},
 {key:"s16",name:"អប់រំបំណិនជីវិត",group:""},{key:"s17",name:"ភាសាបរទេស",group:""}
];
const KH_DIG="០១២៣៤៥៦៧៨៩";

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const fmt=v=>v==null||isNaN(v)?"":String(Math.round(v*100)/100);
const fmt2=v=>v==null?"–":v.toFixed(2);
const pct=(a,b)=>b?Math.round(a/b*1000)/10+"%":"–";
function parseScore(raw,max=10){
  if(raw==null)return {v:null,ok:true};
  let s=String(raw).trim().replace(/[០-៩]/g,c=>KH_DIG.indexOf(c)).replace(",",".");
  if(s==="")return {v:null,ok:true};
  const n=Number(s);
  if(!isFinite(n)||n<0||n>max)return {v:null,ok:false};
  return {v:Math.round(n*100)/100,ok:true};
}
function grade(avg,kind){
  if(avg==null)return null;const K=KINDS[kind]||KINDS.primary;const c=K.grade(avg);
  const g=K.grades.find(x=>x[0]===c);return [c,g[1],g[2],K.letters];
}
const gradeOf=(code,kind)=>{const K=KINDS[kind]||KINDS.primary;const g=K.grades.find(x=>x[0]===code);return g?[g[0],g[1],g[2],K.letters]:null};
const pill=g=>g?`<span class="gpill ${g[2]}">${g[3]?`<b>${g[0]}</b>`:""}${esc(g[1])}</span>`:"";
const clone=o=>JSON.parse(JSON.stringify(o??null));
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function arm(btn,label,fn){ // two-step confirm, no dialogs
  if(btn.dataset.armed){fn();return}
  const old=btn.textContent;btn.dataset.armed="1";btn.classList.add("armed");btn.textContent=label;
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.classList.remove("armed");btn.textContent=old}},3500);
}

/* ---------- state ---------- */
const S={
  ready:{classes:false,settings:false},
  classes:[], settings:null, sheet:null, sheetKey:null,
  sel:{classId:null,period:"m09"}, tab:"home", rcStudent:null,
  canWrite:true, canAdmin:true, user:null, needsSetup:false, users:null, backend:"db", status:"", statusErr:false,
  pending:{}, inflight:{}
};
try{const p=JSON.parse(localStorage.getItem("gb-ui")||"{}");if(p.period&&PNAME[p.period])S.sel.period=p.period;if(p.classId)S.sel.classId=p.classId;if(p.tab)S.tab=p.tab;if(p.branch)S.branch=p.branch}catch(e){}
function saveUI(){try{localStorage.setItem("gb-ui",JSON.stringify({period:S.sel.period,classId:S.sel.classId,tab:S.tab,branch:S.branch}))}catch(e){}}
const FIN_TAB_IDS_ALL=["fdash","fin_in","fin_out","fin_pay","fin_fee","fin_debt","fin_year","fin_set"];
const curClass=()=>S.classes.find(c=>c.id===S.sel.classId)||null;
function levels(){
  const st=S.settings||{};const L=clone(st.levels||{});
  if(!L.primary)L.primary={name:"បឋមសិក្សា",kind:"primary",subjects:(st.subjects&&st.subjects.length)?clone(st.subjects):clone(DEFAULT_SUBJECTS),avgMode:st.avgMode||"entered"};
  if(!L.kinder)L.kinder={name:"មត្តេយ្យ",kind:"kinder",subjects:clone(KINDER_SUBJECTS),avgMode:"all"};
  if(!L.eng_k)L.eng_k={name:"English Pre-Nursery – K4",kind:"eng_k",subjects:clone(ENG_K_SUBJECTS),avgMode:"pct"};
  if(!L.eng_p)L.eng_p={name:"English Primary 1 – 3",kind:"eng_p",subjects:clone(ENG_P_SUBJECTS),avgMode:"pct"};
  for(const id in L){const l=L[id];if(!KINDS[l.kind])l.kind="primary";if(!l.subjects||!l.subjects.length)l.subjects=clone(defSubjects(l.kind));if(!l.avgMode||(KINDS[l.kind].en&&l.avgMode!=="pct"))l.avgMode=KINDS[l.kind].avgMode}
  return L;
}
function defSubjects(kind){return kind==="kinder"?KINDER_SUBJECTS:kind==="eng_k"?ENG_K_SUBJECTS:kind==="eng_p"?ENG_P_SUBJECTS:DEFAULT_SUBJECTS}
// language sections; a head of department runs every class of their sections in their branches
const DEPTS={khmer:"ផ្នែកខ្មែរ",english:"ផ្នែកអង់គ្លេស",chinese:"ផ្នែកចិន"};
const levelDept=l=>(l&&l.dept)||(l&&KINDS[l.kind]&&KINDS[l.kind].en?"english":"khmer");
const isHead=()=>S.backend==="server"&&!!S.user&&S.user.role==="head";
const myDepts=()=>isHead()?(S.user.depts||[]):Object.keys(DEPTS);
const isEn=(cls=curClass())=>!!(cls&&KINDS[kindOf(cls)].en);
const clsLabel=c=>c.name+(c.shift?" · "+c.shift:"");
const levelId=cls=>{const L=levels();const id=cls&&cls.levelId;return id&&L[id]?id:"primary"};
const levelOf=cls=>levels()[levelId(cls)];
const subjects=(cls=curClass())=>levelOf(cls).subjects;
const avgMode=(cls=curClass())=>levelOf(cls).avgMode;
const kindOf=(cls=curClass())=>levelOf(cls).kind;
const periodsOf=(cls=curClass())=>KINDS[kindOf(cls)].periods;
const sheetKey=()=>S.sel.classId?`${S.sel.classId}__${S.sel.period}`:null;

/* ---------- storage backends ---------- */
let api=null;
function makeDbApi(db){
  return {
    watchClasses(cb,err){return db.collection("classes").onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),err)},
    saveClass(c){const {id,...rest}=c;return db.doc("classes/"+id).set(rest)},
    deleteClass(id){return db.doc("classes/"+id).delete()},
    deleteSheet(key){return db.doc("sheets/"+key).delete()},
    watchSettings(cb,err){return db.doc("settings/main").onSnapshot(s=>cb(s.exists?s.data():null),err)},
    saveSettings(o){return db.doc("settings/main").set(o)},
    async getDoc(p){const s=await db.doc(p).get();return s.exists?s.data():null},
    setDoc(p,d){return db.doc(p).set(d)},
    watchSheet(key,cb,err){return db.doc("sheets/"+key).onSnapshot(s=>cb(s.exists?s.data():null),err)},
    watchDoc(p,cb,err){return db.doc(p).onSnapshot(s=>cb(s.exists?s.data():null),err)},
    watchColl(c,cb,err){return db.collection(c).onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});cb(o)},err)},
    async patchDoc(p,data){const ref=db.doc(p);const snap=await ref.get();return snap.exists?ref.update(data):ref.set(data)},
    async patchSheet(key,base,patch){
      const ref=db.doc("sheets/"+key);
      const snap=await ref.get();
      if(snap.exists)return ref.update({scores:patch});
      return ref.set({...base,scores:patch});
    }
  };
}
function makeLocalApi(){
  const KEY="gb-local-v1";let st;
  try{st=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  st=st||{classes:{},settings:null,sheets:{}};st.docs=st.docs||{};
  const subs={classes:new Set(),settings:new Set(),sheets:new Map(),docs:new Map()};
  const collSubs=new Map();
  const collOf=c=>{const o={};for(const k in st.docs){if(k.startsWith(c+"/"))o[k.slice(c.length+1)]=clone(st.docs[k])}return o};
  const emitD=p=>{(subs.docs.get(p)||new Set()).forEach(f=>f(clone(st.docs[p]||null)));const c=p.split("/")[0];(collSubs.get(c)||new Set()).forEach(f=>f(collOf(c)))};
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
  const emitC=()=>subs.classes.forEach(f=>f(Object.entries(st.classes).map(([id,d])=>({id,...clone(d)}))));
  const emitS=()=>subs.settings.forEach(f=>f(clone(st.settings)));
  const emitSh=k=>(subs.sheets.get(k)||new Set()).forEach(f=>f(clone(st.sheets[k]||null)));
  const merge=(a,b)=>{for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==="object")merge(a[k],b[k]);else a[k]=clone(b[k])}return a};
  return {
    watchClasses(cb){subs.classes.add(cb);setTimeout(emitC);return()=>subs.classes.delete(cb)},
    async saveClass(c){const {id,...r}=c;st.classes[id]=clone(r);persist();emitC()},
    async deleteClass(id){delete st.classes[id];persist();emitC()},
    async deleteSheet(k){delete st.sheets[k];persist();emitSh(k)},
    watchSettings(cb){subs.settings.add(cb);setTimeout(emitS);return()=>subs.settings.delete(cb)},
    async saveSettings(o){st.settings=clone(o);persist();emitS()},
    async getDoc(p){return clone(st.docs[p]||null)},
    async setDoc(p,d){st.docs[p]=clone(d);persist();emitD(p)},
    watchDoc(p,cb){if(!subs.docs.has(p))subs.docs.set(p,new Set());subs.docs.get(p).add(cb);setTimeout(()=>cb(clone(st.docs[p]||null)));return()=>subs.docs.get(p).delete(cb)},
    async patchDoc(p,data){st.docs[p]=merge(st.docs[p]||{},data);persist();emitD(p)},
    watchColl(c,cb){if(!collSubs.has(c))collSubs.set(c,new Set());collSubs.get(c).add(cb);setTimeout(()=>cb(collOf(c)));return()=>collSubs.get(c).delete(cb)},
    watchSheet(k,cb){if(!subs.sheets.has(k))subs.sheets.set(k,new Set());subs.sheets.get(k).add(cb);setTimeout(()=>cb(clone(st.sheets[k]||null)));return()=>subs.sheets.get(k).delete(cb)},
    async patchSheet(k,base,patch){if(!st.sheets[k])st.sheets[k]={...base,scores:{}};merge(st.sheets[k].scores,patch);persist();emitSh(k)}
  };
}

/* ---------- saving scores (debounced, one write at a time) ---------- */
let flushTimer=null,writing=Promise.resolve();
function setStatus(t,err){S.status=t;S.statusErr=!!err;const el=$("#saveStatus");if(el){el.textContent=t;el.className="status"+(err?" err":"")}}
function queueScore(sid,key,v){
  (S.pending[sid]=S.pending[sid]||{})[key]=v;
  setStatus("មិនទាន់រក្សាទុក…");
  clearTimeout(flushTimer);flushTimer=setTimeout(flush,600);
}
function flush(){
  const k=sheetKey();if(!k)return;
  const patch=S.pending;if(!Object.keys(patch).length)return;
  S.pending={};
  for(const sid in patch){S.inflight[sid]=Object.assign(S.inflight[sid]||{},patch[sid])}
  setStatus("កំពុងរក្សាទុក…");
  writing=writing.then(()=>api.patchSheet(k,{classId:S.sel.classId,period:S.sel.period},patch)).then(()=>{
    for(const sid in patch)for(const key in patch[sid]){if(S.inflight[sid]&&S.inflight[sid][key]===patch[sid][key])delete S.inflight[sid][key]}
    setStatus("បានរក្សាទុក ✓");
  }).catch(e=>{
    // put edits back so nothing typed is lost
    for(const sid in patch){S.pending[sid]=Object.assign({},patch[sid],S.pending[sid]||{})}
    S.inflight={};
    if(e&&e.code==="invalid_argument"){S.canWrite=false;setStatus("អ្នកមិនមានសិទ្ធិកែពិន្ទុទេ (មើលបានតែប៉ុណ្ណោះ)",true);render()}
    else setStatus("រក្សាទុកមិនបាន — កំពុងព្យាយាមម្ដងទៀត",true),setTimeout(flush,3000);
  });
}
function scoreOf(sid,key){
  if(S.pending[sid]&&key in S.pending[sid])return S.pending[sid][key];
  if(S.inflight[sid]&&key in S.inflight[sid])return S.inflight[sid][key];
  const sc=S.sheet&&S.sheet.scores&&S.sheet.scores[sid];
  const v=sc?sc[key]:null;return typeof v==="number"?v:null;
}

/* ---------- computation ---------- */
function compute(cls){
  const subs=subjects(cls),mode=avgMode(cls),kind=kindOf(cls),K=KINDS[kind];
  const fullMax=subs.reduce((a,sb)=>a+smax(sb),0);
  const rows=(cls?cls.students:[]).map((s,i)=>{
    const vals=subs.map(sb=>scoreOf(s.id,sb.key));
    const got=vals.filter(v=>v!=null);
    const total=got.reduce((a,b)=>a+b,0);
    const avg=got.length?(mode==="pct"?total/fullMax*100:mode==="all"?total/subs.length:total/got.length):null;
    return {s,i,vals,total:got.length?total:null,avg:avg==null?null:Math.round(avg*100)/100,count:got.length};
  });
  rows.forEach(r=>{r.rank=r.avg==null?null:1+rows.filter(o=>o.avg!=null&&o.avg>r.avg).length;r.g=grade(r.avg,kind)});
  const subjAvg=subs.map((_,j)=>{const v=rows.map(r=>r.vals[j]).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null});
  const graded=rows.filter(r=>r.avg!=null);
  const tot=rows.length,fem=rows.filter(r=>r.s.g==="F").length;
  const PM=K.pass??5;const pass=graded.filter(r=>r.avg>=PM),fail=graded.filter(r=>r.avg<PM);
  const dist={};K.grades.forEach(([l])=>{const rs=graded.filter(r=>r.g[0]===l);dist[l]={n:rs.length,f:rs.filter(r=>r.s.g==="F").length}});
  const classAvg=graded.length?graded.reduce((a,r)=>a+r.avg,0)/graded.length:null;
  return {K,kind,subs,rows,subjAvg,tot,fem,graded,pass,fail,dist,classAvg,fullMax,en:!!K.en,
    passF:pass.filter(r=>r.s.g==="F").length,failF:fail.filter(r=>r.s.g==="F").length};
}

function refreshComputed(){
  const cls=curClass();if(!cls||S.tab!=="scores")return;
  const C=compute(cls);const grid=$("#grid");if(!grid)return;
  C.rows.forEach((r,ri)=>{
    const tr=grid.tBodies[0].rows[ri];if(!tr)return;
    tr.querySelector('[data-o="total"]').textContent=r.total==null?"":fmt(r.total);
    tr.querySelector('[data-o="avg"]').textContent=r.avg==null?"":r.avg.toFixed(2);
    tr.querySelector('[data-o="rank"]').innerHTML=r.rank?`<span class="rank ${r.rank<=3?"top":""}">${r.rank}</span>`:"";
    tr.querySelector('[data-o="g"]').innerHTML=pill(r.g);
    tr.querySelectorAll("input").forEach((inp,j)=>{
      if(document.activeElement===inp||inp.classList.contains("bad"))return;
      const v=r.vals[j];const s=v==null?"":fmt(v);if(inp.value!==s)inp.value=s;
      inp.classList.toggle("low",v!=null&&v<5);
    });
  });
  grid.querySelectorAll("[data-sa]").forEach(td=>{const v=C.subjAvg[+td.dataset.sa];td.textContent=v==null?"":v.toFixed(1)});
  const ca=grid.querySelector('[data-o="cavg"]');if(ca)ca.textContent=C.classAvg==null?"":C.classAvg.toFixed(2);
  $("#statStrip").innerHTML=statsHTML(C);$("#sumPanel").innerHTML=summaryHTML(C);
}

  {const c=curClass();if(c)ensurePhotos(c.students.map(s=>s.id))}

  grid.addEventListener("input",e=>{
    const inp=e.target;if(!inp.matches("input")||!S.canWrite)return;
    const sid=inp.closest("tr").dataset.sid,key=inp.dataset.k;
    const mx=+inp.dataset.max||10;const p=parseScore(inp.value,mx);
    inp.classList.toggle("bad",!p.ok);inp.title=p.ok?"":"ពិន្ទុត្រូវនៅចន្លោះ ០ ដល់ "+toKh(mx);

    inp.classList.toggle("low",p.v!=null&&p.v<mx/2);
    queueScore(sid,key,p.v);refreshComputed();
  });
  grid.addEventListener("keydown",e=>{
    const inp=e.target;if(!inp.matches("input"))return;
    let r=+inp.dataset.r,c=+inp.dataset.c;
    const atStart=inp.selectionStart===0&&inp.selectionEnd===0,atEnd=inp.selectionStart===inp.value.length;
    if(e.key==="Enter"||e.key==="ArrowDown")r++;
    else if(e.key==="ArrowUp")r--;
    else if(e.key==="ArrowRight"&&atEnd)c++;
    else if(e.key==="ArrowLeft"&&atStart)c--;
    else return;
    const t=grid.querySelector(`input[data-r="${r}"][data-c="${c}"]`);
    if(t){e.preventDefault();t.focus();t.select()}
  });
  grid.addEventListener("focusin",e=>{if(e.target.matches("input"))e.target.select()});
}

function saveClass(cls){

function parseLine(line){
  let t=line.replace(/\t+/g," ").trim().replace(/^\d+[.)\s]+/,"").trim();if(!t)return null;
  let g="M";const m=t.match(/\s+(ស|ប|ស្រី|ប្រុស|F|M|f|m)$/);
  if(m){g=/^(ស|ស្រី|F|f)$/.test(m[1])?"F":"M";t=t.slice(0,m.index).trim()}
  return t?{id:uid(),name:t,g}:null;
}

const ATT=[["P","មក"],["L","យឺត"],["E","ច្បាប់"],["A","ឥតច្បាប់"]];
const ATT_SYM={L:"យ",E:"ច",A:"អ"};
const KH_DAYS=["អាទិត្យ","ច័ន្ទ","អង្គារ","ពុធ","ព្រហស្បតិ៍","សុក្រ","សៅរ៍"];
const pad2=n=>String(n).padStart(2,"0");
const isoOf=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const dateOf=iso=>{const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d)};
function khDate(iso){const d=dateOf(iso);return `ថ្ងៃ${KH_DAYS[d.getDay()]} ទី${toKh(d.getDate())} ${KH_MONTHS[d.getMonth()]} ${toKh(d.getFullYear())}`}
S.att={date:isoOf(new Date()),view:"day",key:null,doc:null,unsub:null,pend:{days:{},marked:{}},attCache:{}};
function attWatch(){
  const cls=curClass();if(!cls)return;
  const k=`${cls.id}__${S.att.date.slice(0,7)}`;if(k===S.att.key)return;

  S.att.key=k;S.att.doc=null;
  S.att.unsub=api.watchDoc("attendance/"+k,d=>{if(S.att.key!==k)return;S.att.doc=d||{};S.att.attCache[k]=d;if(S.tab==="attendance")refreshAtt()});
}
function attStatus(date,sid){
  const p=S.att.pend.days[date];if(p&&sid in p)return p[sid]||"P";
  const d=S.att.doc&&S.att.doc.days&&S.att.doc.days[date];return (d&&d[sid])||"P";
}
const attMarked=date=>!!(S.att.pend.marked[date]||(S.att.doc&&S.att.doc.marked&&S.att.doc.marked[date]));
let attTimer=null,attWrite=Promise.resolve();
function setAtt(sid,code){
  const d=S.att.date;(S.att.pend.days[d]=S.att.pend.days[d]||{})[sid]=code==="P"?null:code;S.att.pend.marked[d]=true;
  setStatus("មិនទាន់រក្សាទុក…");clearTimeout(attTimer);attTimer=setTimeout(flushAtt,600);
}
function flushAtt(){

  for(const d in pend.days){local.days[d]=Object.assign(local.days[d]||{},pend.days[d])}
  Object.assign(local.marked,pend.marked);if(S.att.key===k){S.att.doc=local}

function monthKeyForPeriod(p){

}

/* ---------- file download (Claude viewer or ordinary browser) ---------- */
async function saveFile(filename,data){
  if(window.claude){
    const dl=await window.claude.use("downloads").catch(()=>null);
    if(!dl){toast("ការទាញយកមិនអាចប្រើបាននៅទីនេះទេ");return false}
    try{await dl.save({filename,data});return true}catch(e){if(e&&e.code!=="declined")toast("ទាញយកមិនបាន");return false}
  }
  const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),5000);return true;
}

function fitHonorSheet(el){
  const fr=el&&el.querySelector(".hs-frame");if(!fr)return;
  // one photo size per number of rows, the same for every class (Khmer and English); shrink only if a page would still overflow
  // the same photo size whether the class shows 3, 5 or 7 students (only 10 needs smaller photos to fit one A4 page)
  const R=+el.dataset.rows||3;let w=R<=3?84:R===4?48:R===5?40:36;
  const set=()=>{el.style.setProperty("--pw",w+"px");el.style.setProperty("--pw1",Math.min(185,Math.round(w*1.2))+"px")};
  // only the students' area decides: a large stamp or signature picture in the footer must not shrink the photos
  const pod=fr.querySelector(".hs-podium"),over=()=>pod?pod.scrollHeight>pod.clientHeight+1:fr.scrollHeight>fr.clientHeight+1;
  set();for(let i=0;i<24&&over()&&w>36;i++){w=Math.round(w*.94);set()}
}

async function shrinkImage(file,W,H,cover){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,W,H);
    const r=cover?Math.max(W/img.width,H/img.height):Math.min(W/img.width,H/img.height);
    const w=img.width*r,h=img.height*r;x.drawImage(img,(W-w)/2,(H-h)/2,w,h);
    return c.toDataURL("image/jpeg",.82);
  }finally{URL.revokeObjectURL(url)}
}

function photoInitial(name){const w=String(name||"").trim().split(/\s+/).filter(x=>!/^[\d០-៩]+$/.test(x));return (w[w.length-1]||"?").slice(0,1)}

function paintAvatars(){document.querySelectorAll("[data-av]").forEach(el=>{const ph=S.photos[el.dataset.av];if(ph&&!el.querySelector("img"))el.innerHTML=`<img src="${ph}" alt="">`;if(ph===null&&el.querySelector("img"))el.innerHTML=`<i>${esc(photoInitial(el.title))}</i>`})}

async function bulkPhotos(files){
  const cls=curClass();if(!cls)return;
  const norm=x=>String(x||"").replace(/\.[a-z0-9]+$/i,"").replace(/[\u200b\u200c\u200d]/g,"").replace(/[\s_\-.]+/g,"").replace(/[០-៩]/g,c=>KH_DIG.indexOf(c));
  let ok=0;const miss=[];
  for(const f of files){
    const key=norm(f.name);let st=cls.students.find(s=>norm(s.name)===key);
    if(!st&&/^\d+$/.test(key))st=cls.students[+key-1];
    if(!st){miss.push(f.name);continue}
    setStatus(`កំពុងដាក់រូប ${ok+1}/${files.length}…`);
    try{const data=await shrinkImage(f,360,450,true);S.photos[st.id]=data;paintAvatars();await api.setDoc("photos/"+st.id,{data,at:Date.now()});ok++}catch(e){miss.push(f.name)}
  }
  setStatus(ok?"បានរក្សាទុក ✓":"");
  toast(`បានដាក់រូប ${ok} នាក់`+(miss.length?` · រកមិនឃើញឈ្មោះ ${miss.length} រូប`:""));
  S.photoMiss=miss.length?"រកឈ្មោះសិស្សមិនឃើញសម្រាប់៖ "+miss.join(", ")+" · សូមប្ដូរឈ្មោះឯកសារឱ្យដូចឈ្មោះសិស្ស ឬលេខរៀង":"";showPhotoMiss();
}

  S.photos[target]=data;refreshHonor();paintAvatars();if(S.tab==="settings")render();

}

// photo of ink on paper → transparent PNG, trimmed to the ink
async function inkImage(file,maxW,maxH){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const r=Math.min(1,maxW/img.width,maxH/img.height);const W=Math.round(img.width*r),H=Math.round(img.height*r);
    const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.drawImage(img,0,0,W,H);
    const d=x.getImageData(0,0,W,H),p=d.data;let x0=W,y0=H,x1=-1,y1=-1;
    for(let i=0;i<p.length;i+=4){
      if(p[i+3]<10){p[i+3]=0;continue}
      const mn=Math.min(p[i],p[i+1],p[i+2]),mx=Math.max(p[i],p[i+1],p[i+2]);
      const ink=Math.max(255-mn,(mx-mn)*1.6);           // dark or coloured = ink
      const a=Math.max(0,Math.min(1,(ink-40)/90));
      p[i+3]=Math.round(p[i+3]*a);
      if(p[i+3]>30){const q=i/4,px=q%W,py=(q-px)/W;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py}
    }
    if(x1<0)throw new Error("empty");
    x.putImageData(d,0,0);const pad=4;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(W-1,x1+pad);y1=Math.min(H-1,y1+pad);
    const o=document.createElement("canvas");o.width=x1-x0+1;o.height=y1-y0+1;o.getContext("2d").drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
    return o.toDataURL("image/png");
  }finally{URL.revokeObjectURL(url)}
}

async function importEnglish(parsed){

  const nrm=v=>String(v||"").replace(/[\s,\-–.]/g,"").toLowerCase();
  let done=0,studs=0;const skipped=[];
  for(const p of parsed){
    const meta=p.meta;if(!p.studs.some(st=>Object.keys(st.sc).length)&&parsed.length>1)continue;
    const labels=p.cols.map(x=>nrm(x.label));
    const engIds=Object.keys(L).filter(id=>KINDS[L[id].kind].en);
    const fit=id=>L[id].subjects.filter(s=>labels.includes(nrm(s.name))).length;
    const best=engIds.sort((a,b)=>fit(b)-fit(a))[0]||"eng_p";
    const shift=meta.shift||"";const cur=curClass();
    if(!meta.cls&&!(cur&&KINDS[kindOf(cur)].en)){toast("សូមវាយឈ្មោះថ្នាក់ក្នុង Excel នៅជួរ «English Class:» ឧ. English Class: Primary 1A 2026-2027 ឬជ្រើសថ្នាក់អង់គ្លេសមុននាំចូល");return}
    const name=meta.cls||cur.name;
    let cls=meta.cls?(S.classes.find(c=>idOf(c.name)===idOf(name)&&(c.shift||"")===shift)||S.classes.find(c=>idOf(c.name)===idOf(name)&&!c.shift&&!shift)||null):cur;
    if(!cls){cls=await createClass(name,meta.year||"",meta.teacher||"",best);if(!cls)return;cls=clone(cls);cls.shift=shift}else cls=clone(cls);
    if(!KINDS[kindOf(cls)].en)cls.levelId=best;
    if(meta.year&&!cls.year)cls.year=meta.year;
    const lv=L[levelId(cls)];const keyFor={};let added=false;
    p.cols.forEach(({label,max})=>{let sb=lv.subjects.find(s=>nrm(s.name)===nrm(label));
      if(!sb){sb={key:"x"+uid(),name:label,group:"",max:max||100};lv.subjects.push(sb);added=true}
      keyFor[label]=sb.key});
    if(added)await saveLevels(L);

    const patch={};

      if(!ex){ex={id:uid(),name:st.name,g:st.g};cls.students.push(ex)}
      const sc={};for(const lab in st.sc)sc[keyFor[lab]]=st.sc[lab];if(Object.keys(sc).length)patch[ex.id]=sc;studs++});
    await saveClass(cls);
    S.classes=S.classes.some(c=>c.id===cls.id)?S.classes.map(c=>c.id===cls.id?cls:c):[...S.classes,cls];
    if(Object.keys(patch).length){try{await api.patchSheet(`${cls.id}__${per}`,{classId:cls.id,period:per},patch)}catch(e){skipped.push(p.sheet)}}
    S.sel.classId=cls.id;S.sel.period=per;done++;L=levels();
  }
  saveUI();watchSheet();render();
  toast(`បាននាំចូល ${done} សន្លឹក · សិស្ស ${studs} នាក់${skipped.length?" · មិនបាន៖ "+skipped.join(", "):""}`);
}
async function importXlsx(file){

  const clean=v=>String(v??"").replace(/[\u200b\u200c\u200d\ufeff]/g,"").replace(/\s+/g," ").trim();
  const norm=v=>clean(v).replace(/\s*\d+\s*%?$/,"").replace(/\s*(១០)$/,"").replace(/[\s,\-–.]/g,"").replace("អបរំ","អប់រំ").toLowerCase();

    for(const sn of wb.SheetNames){
      const rows=X.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:null});
      const NAMERE=/គោត្តនាម|ឈ្មោះសិស្ស|name of student/i,ENDRE=/សរុប|មធ្យមភាគ|^total$|^average$/i;
      const hi=rows.findIndex(row=>row&&row.some(c=>typeof c==="string"&&NAMERE.test(c)));
      if(hi<0)continue;

      const gCol=H0.findIndex(c=>/^(ភេទ|sex|gender)$/i.test(clean(c)));
      // the subject names sit on the row that also says Total / Average (one, two or three header rows)
      let hr=hi;for(let q=hi;q<=Math.min(hi+3,rows.length-1);q++){if((rows[q]||[]).some(c=>ENDRE.test(clean(c)))){hr=q;break}}
      const sub=rows[hi+1]||[];
      const useSub=hr===hi&&!clean(sub[nameCol])&&sub.some(c=>typeof c==="string"&&clean(c));
      const HR=rows[hr]||[];
      const H=(hr>hi?HR:H0).map((c,k)=>hr>hi?clean(c):useSub&&clean(sub[k])?clean(sub[k]):clean(c));
      const width=Math.max(H0.length,sub.length,HR.length);
      let endCol=-1;for(let k=nameCol+1;k<width;k++){if(ENDRE.test(H[k]||"")){endCol=k;break}}
      const cols=[];for(let k=Math.max(nameCol,gCol)+1;k<(endCol>0?endCol:width);k++){const h=H[k]||"";if(h&&h!=="មុខវិជ្ជា"){const mm=h.match(/(\d+)\s*%\s*$/);cols.push({c:k,label:h.replace(/\s*\d+\s*%\s*$/,"").replace(/\s*(១០|10)$/,"").replace(/,/g," ").trim(),max:mm?+mm[1]:null})}}
      const studs=[];
      for(let r=(hr>hi?hr+1:hi+(useSub?2:1));r<rows.length;r++){
        const row=rows[r]||[];const nm=clean(row[nameCol]);
        const lead=clean(row[0]);
        if(/សិស្សសរុប|បញ្ឈប់|total students/i.test(lead))break;
        if(!nm)continue;
        if(/[:៖ៈ]|បញ្ឈប់|មធ្យមភាគ|សរុប/.test(nm))break;
        const gv=gCol>=0?clean(row[gCol]):"";
        const sc={};cols.forEach(({c,label,max})=>{const p=parseScore(row[c],max||1000);if(p.ok&&p.v!=null)sc[label]=p.v});
        studs.push({name:nm.replace(/\.\s*/g," ").replace(/\s+/g," ").trim(),g:/^(ស|f)/i.test(gv)?"F":"M",sc});
      }

        if(key&&!meta[key]){for(let q=k+1;q<row.length;q++){const v=clean(row[q]);if(v){meta[key]=v;break}}}
        // English layout: "English Class: Primary 1A 2026-2027", "Shift: Morning", "For the month of October" / "Midterm Exam · Course 1"
        const tc=clean(c);let m;
        if((m=tc.match(/^English\s*Class\s*:?\s*(.+?)(?:\s+(\d{4}\s*-\s*\d{4}))?$/i))){meta.cls=m[1].trim();if(m[2])meta.year=m[2].replace(/\s/g,"");meta.en=true}
        if((m=tc.match(/^Shift\s*:?\s*(\w+)/i)))meta.shift=m[1][0].toUpperCase()+m[1].slice(1).toLowerCase();
        if((m=tc.match(/^For the month of\s+(\w+)/i))){const i=MONTH_EN.findIndex(x=>x.toLowerCase()===m[1].toLowerCase());if(i>=0)meta.period="m"+String(i+1).padStart(2,"0")}
        if((m=tc.match(/(midterm|final)[^0-9]*course\s*(\d)/i)))meta.period="e"+m[2]+(m[1].toLowerCase()==="midterm"?"m":"f");})}
      // the sheet name may say the shift: "GEP2 (Morning)"
      {const m2=String(sn).match(/morning|afternoon|evening/i);if(m2)meta.shift=m2[0][0].toUpperCase()+m2[0].slice(1).toLowerCase()}

  if(!parsed.length){toast("រកមិនឃើញឈ្មោះសិស្សក្នុងឯកសារ");return}

  }else{
    cls=curClass();
    if(!cls||(levelId(cls)!==best&&fit(levelId(cls))<fit(best))){cls=await createClass(L[best].name+" (នាំចូល)","","",best);if(!cls)return}
  }
  cls=clone(cls);
  if(levelId(cls)!==best&&fit(levelId(cls))<fit(best))cls.levelId=best;
  if(meta.year&&!cls.year)cls.year=meta.year;
  if(meta.teacher&&!cls.teacher)cls.teacher=meta.teacher;
  const lid=levelId(cls);
  // map columns to subject keys, adding any new subjects to this level
  const lv=L[lid];const keyFor={};const added=[];
  parsed.forEach(p=>p.cols.forEach(({label})=>{

  try{for(const per in patches){if(Object.keys(patches[per]).length)await api.patchSheet(`${cls.id}__${per}`,{classId:cls.id,period:per},patches[per])}

  S.sel.classId=cls.id;S.sel.period=plan[plan.length-1][0];S.tab="scores";saveUI();
  S.sheetKey=null;watchSheet();render();

}

/* ---------- self-hosted server (api.php) ---------- */
const pollers=new Set();
function kick(){pollers.forEach(f=>f())}
async function req(a,body){
  const opt={method:body?"POST":"GET",credentials:"same-origin",headers:{"Accept":"application/json"}};
  if(body){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body)}
  let r;try{r=await fetch("api.php?a="+a,opt)}catch(e){throw {code:"unavailable",message:"network"}}
  let j=null;try{j=await r.json()}catch(e){}
  if(r.status===401&&a!=="login"){if(S.user)location.reload();throw {code:"unauthenticated"}}
  if(r.status===403||r.status===401)throw {code:"invalid_argument",message:(j&&j.error)||"forbidden"};
  if(!r.ok||!j)throw {code:"unavailable",message:(j&&j.error)||String(r.status)};
  if(body&&/^(set|patch|del)$/.test(a))setTimeout(kick,50);
  return j;
}
function poll(fetcher,cb,ms){
  let stop=false,last=null,t=null,busy=false;
  const tick=async()=>{if(stop||busy)return;busy=true;clearTimeout(t);
    try{const v=await fetcher();if(v!==SAME){const k=JSON.stringify(v);if(k!==last){last=k;cb(v)}}}catch(e){}
    busy=false;if(!stop)t=setTimeout(tick,document.hidden?ms*4:ms)};
  pollers.add(tick);t=setTimeout(tick,0);
  return()=>{stop=true;clearTimeout(t);pollers.delete(tick)};
}
const SAME={};
function makeServerApi(){
  // reads asked for in the same moment (all the photos of a class, say) go out as one request
  let batch=null;
  const flushGet=async()=>{const b=batch;batch=null;const paths=[...b.keys()];
    for(let i=0;i<paths.length;i+=150){const part=paths.slice(i,i+150);
      try{const j=await req("getmany",{paths:part});part.forEach(p=>b.get(p).forEach(([ok])=>ok(j.docs&&j.docs[p]!==undefined?j.docs[p]:null)))}
      catch(e){part.forEach(p=>b.get(p).forEach(([,no])=>no(e)))}}};
  const get=p=>new Promise((ok,no)=>{if(!batch){batch=new Map();setTimeout(flushGet,10)}if(!batch.has(p))batch.set(p,[]);batch.get(p).push([ok,no])});
  // polls send what they last saw; an unchanged answer is a few bytes and nothing is redrawn
  const pollGet=(p,cb,ms)=>{let v="";return poll(()=>req("get&p="+encodeURIComponent(p)+"&v="+v).then(j=>{if(j.same)return SAME;v=j.v||"";return j.data}),cb,ms)};
  const pollList=(c,map,cb,ms)=>{let v="";return poll(()=>req("list&c="+c+"&v="+v).then(j=>{if(j.same)return SAME;v=j.v||"";return map(j.docs)}),cb,ms)};
  return {
    watchClasses(cb){return pollList("classes",docs=>docs.map(d=>({id:d.id,...d.data})),cb,15000)},
    saveClass(c){const {id,...rest}=c;return req("set",{p:"classes/"+id,data:rest})},
    deleteClass(id){return req("del",{p:"classes/"+id})},
    deleteSheet(k){return req("del",{p:"sheets/"+k})},
    watchSettings(cb){return pollGet("settings/main",cb,30000)},
    saveSettings(o){return req("set",{p:"settings/main",data:o})},
    getDoc:get,
    setDoc(p,d){return req("set",{p,data:d})},
    watchSheet(k,cb){return pollGet("sheets/"+k,cb,10000)},
    watchDoc(p,cb){return pollGet(p,cb,15000)},
    watchColl(c,cb,err){return pollList(c,docs=>{const o={};docs.forEach(d=>{o[d.id]=d.data});return o},cb,15000)},
    patchDoc(p,data){return req("patch",{p,data})},
    patchSheet(k,base,patch){return req("patch",{p:"sheets/"+k,data:{...base,scores:patch}})}
  };
}

function finSettings(){const d=(S.fin.docs.settings)||{};const o=Object.assign(clone(FIN_DEFAULT),d);o.lists=Object.assign(clone(FIN_DEFAULT.lists),d.lists||{});return o}
const fy=()=>S.fin.year??finSettings().startYear;
function fyMonths(y=fy()){const sm=finSettings().startMonth;return [...Array(12)].map((_,i)=>{const m=(sm-1+i)%12+1;return `${y+(sm-1+i>=12?1:0)}-${pad2(m)}`})}
const monthLabel=k=>`ខែ${KH_MONTHS[+k.slice(5)-1]} ${toKh(k.slice(0,4))}`;
function curFm(){const ms=fyMonths();if(ms.includes(S.fin.month))return S.fin.month;const t=isoOf(new Date()).slice(0,7);return S.fin.month=ms.includes(t)?t:ms[0]}
const n2=v=>{const x=Number(v);return isFinite(x)?x:0};
const usd=v=>(v<0?"-":"")+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const riel=v=>Math.round(v*finSettings().rate).toLocaleString("en-US")+" ៛";
function frows(kind,m){const d=S.fin.docs[`${kind}_${m}`];return Object.entries((d&&d.rows)||{}).filter(([,r])=>r&&typeof r==="object").map(([id,r])=>({id,...r}))}
function fees(){const d=S.fin.docs.fees;return Object.entries((d&&d.rows)||{}).filter(([,r])=>r&&typeof r==="object").map(([id,r])=>({id,...r})).sort((a,b)=>(a.order??0)-(b.order??0)||String(a.name).localeCompare(String(b.name),"km"))}
const gross=r=>n2(r.base)+n2(r.allow)+n2(r.bonus);
const net=r=>gross(r)-n2(r.tax)-n2(r.nssf)-n2(r.deduct);
const sumBy=(rs,f)=>rs.reduce((a,r)=>a+f(r),0);
const isTuition=cat=>String(cat||"").startsWith("ថ្លៃសិក្សា");
const sameName=(a,b)=>String(a||"").replace(/\s+/g,"")===String(b||"").replace(/\s+/g,"");
function feePaid(name,m){return sumBy(frows("in",m).filter(r=>sameName(r.party,name)&&isTuition(r.cat)),r=>n2(r.amount))}
function monthStats(m){
  const L=finSettings().lists;const inc=frows("in",m),out=frows("out",m),pay=frows("pay",m);
  const byCat=(rs,cats)=>{const o={};cats.forEach(c=>o[c]=0);let other=0;rs.forEach(r=>{if(r.cat in o)o[r.cat]+=n2(r.amount);else other+=n2(r.amount)});return {o,other}};
  const I=byCat(inc,L.inCats),E=byCat(out,L.outCats);
  const inT=sumBy(inc,r=>n2(r.amount)),exT=sumBy(out,r=>n2(r.amount)),payT=sumBy(pay,gross);
  const by=(rs,meth,f)=>sumBy(rs.filter(r=>r.method===meth),f);
  const fl=fees();const due=sumBy(fl,f=>Math.max(0,n2(f.fee)-n2(f.discount)));
  const paidFee=fl.map(f=>({f,due:Math.max(0,n2(f.fee)-n2(f.discount)),paid:feePaid(f.name,m)}));
  const collected=sumBy(paidFee,x=>Math.min(x.paid,x.due)),owed=sumBy(paidFee,x=>Math.max(0,x.due-x.paid));
  const noMethod=[...inc,...out,...pay].filter(r=>r.method!==CASH&&r.method!==BANK).length;
  return {inc,out,pay,I,E,inT,exT,payT,totalOut:exT+payT,net:inT-exT-payT,
    cashIn:by(inc,CASH,r=>n2(r.amount)),bankIn:by(inc,BANK,r=>n2(r.amount)),
    cashOut:by(out,CASH,r=>n2(r.amount)),bankOut:by(out,BANK,r=>n2(r.amount)),
    cashPay:by(pay,CASH,gross),bankPay:by(pay,BANK,gross),
    due,collected,owed,debtors:paidFee.filter(x=>x.due-x.paid>0.005).length,feeCount:fl.length,noMethod};
}
function yearStats(){
  const st=finSettings();let cash=n2(st.openCash),bank=n2(st.openBank);
  return fyMonths().map(m=>{const s=monthStats(m);s.m=m;s.openCash=cash;s.openBank=bank;
    cash=cash+s.cashIn-s.cashOut-s.cashPay;bank=bank+s.bankIn-s.bankOut-s.bankPay;s.closeCash=cash;s.closeBank=bank;return s});
}

function finLocal(path,patch){ // show a write at once; the store's copy follows
  const k=path.replace(/^fin\//,"");const d=clone(S.fin.docs[k]||{});
  const mergeIn=(a,b)=>{for(const x in b){if(b[x]&&typeof b[x]==="object"&&!Array.isArray(b[x])&&a[x]&&typeof a[x]==="object")mergeIn(a[x],b[x]);else a[x]=clone(b[x])}return a};
  S.fin.docs[k]=mergeIn(d,patch);S.fin.allDocs=S.fin.allDocs||{};S.fin.allDocs[fpath(k)]=S.fin.docs[k];
}

function bindLedger(kind){
  const f=$("#fLed");const L=finSettings().lists;
  const party=$("#lParty");
  if(kind==="in"&&party)party.addEventListener("change",()=>{const fe=fees().find(x=>sameName(x.name,party.value));if(!fe)return;
    if($("#lCls")&&!$("#lCls").value&&fe.cls){$("#lCls").innerHTML=opts(L.classes,fe.cls,"—")}
    if(!$("#lAmt").value){const due=Math.max(0,n2(fe.fee)-n2(fe.discount)),paid=feePaid(fe.name,($("#lDate").value||curFm()).slice(0,7));const rest=Math.max(0,due-paid);if(rest)$("#lAmt").value=rest}
    if(!$("#lCat").value){const tc=L.inCats.find(c=>isTuition(c)&&fe.program&&c.includes(fe.program))||"";if(tc)$("#lCat").value=tc}});
  const c=$("#lCancel");if(c)c.onclick=()=>{S.fin.edit=null;render()};
  f.addEventListener("submit",e=>{e.preventDefault();

    const date=$("#lDate").value;if(!date)return;

    const bucket=`${kind}_${date.slice(0,7)}`;
    if(old&&old.bucket!==bucket)finPatch("fin/"+old.bucket,{rows:{[id]:null}});
    finPatch("fin/"+bucket,{rows:{[id]:row}});
    const where=date.slice(0,7)!==curFm()?` (ក្នុង${monthLabel(date.slice(0,7))})`:"";
    toast((old?"បានកែ":"បានបន្ថែម")+" "+usd(amt)+where);

  });

async function exportLedger(kind){

function finChart(ys){

  const step=Math.pow(10,Math.floor(Math.log10(mx)));const top=Math.ceil(mx/step)*step;
  const y=v=>pt+ih-v/top*ih;const bw=iw/12;
  const ticks=[0,.25,.5,.75,1].map(t=>t*top);
  return `<svg viewBox="0 0 ${W} ${H}" class="fchart" role="img" aria-label="ចំណូល និងចំណាយប្រចាំខែ">

    ${ys.map((s,i)=>{const x0=pl+i*bw+bw*.16,w=bw*.32;return `<rect x="${x0}" y="${y(s.inT)}" width="${w}" height="${Math.max(0,ih-(y(s.inT)-pt))}" class="bin"><title>${monthLabel(s.m)} ចំណូល ${usd(s.inT)}</title></rect>
      <rect x="${x0+w+2}" y="${y(s.totalOut)}" width="${w}" height="${Math.max(0,ih-(y(s.totalOut)-pt))}" class="bout"><title>${monthLabel(s.m)} ចំណាយ ${usd(s.totalOut)}</title></rect>
      <text x="${pl+i*bw+bw/2}" y="${H-12}" text-anchor="middle" class="ax">${KH_MONTHS[+s.m.slice(5)-1]}</text>`}).join("")}
  </svg>`;
}

  const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,"សង្ខេបប្រចាំឆ្នាំ");
  const fn=`សង្ខេបហិរញ្ញវត្ថុ-${fy()}-${fy()+1}.xlsx`;if(await saveFile(fn,new Uint8Array(X.write(wb,{type:"array",bookType:"xlsx"}))))toast("បានទាញយក "+fn);
}

/* ---------- finance settings and Excel import ---------- */
function viewFinSettings(){

  const ta=(id,lab,arr,hint)=>`<div class="field"><label for="${id}">${lab}</label><textarea class="inp" id="${id}" rows="6" ${dis}>${esc(arr.join("\n"))}</textarea>${hint?`<span class="hint">${hint}</span>`:""}</div>`;
